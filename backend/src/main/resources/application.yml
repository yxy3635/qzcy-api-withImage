server:
  port: 8080
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:512}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:20}
    accept-count: ${TOMCAT_ACCEPT_COUNT:2048}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}

spring:
  application:
    name: imageCreater-backend
  # 默认使用 dev 环境，线上启动时通过 --spring.profiles.active=prod 覆盖
  profiles:
    active: dev
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:replace-me}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      image:
        options:
          model: dall-e-3

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET:imageCreater-development-secret-key-change-me-please-32}
    expiration-ms: 86400000
  upload:
    image-path: userImage/
  image:
    cost: 0.10
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    dev-return-code: true
  relay:
    model-status-cache:
      # 仅缓存模型状态页的全站最近调用条；仪表盘余额、用量等仍实时查询。
      redis-enabled: ${RELAY_MODEL_STATUS_CACHE_REDIS_ENABLED:false}
      ttl-seconds: ${RELAY_MODEL_STATUS_CACHE_TTL_SECONDS:30}
